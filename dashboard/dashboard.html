<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transplate · Blind Human Evaluation</title>
<style>

:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6f8;--ink:#172033;--muted:#5d697b;--line:#d6dde6;--surface:#fff;--soft:#f7f9fb;--accent:#3157d5;--accentsoft:#eef2ff;--good:#16784b;--goodsoft:#ecfdf3;--warn:#946200;--warnsoft:#fff7df;--bad:#b42318}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#f4f6f8;color:var(--ink);font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #7b96f4;outline-offset:2px}.hidden{display:none!important}
.appbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:10px 22px}.barrow{max-width:1500px;margin:auto;display:flex;align-items:center;gap:16px}.brand{font-weight:700;letter-spacing:.06em}.crumb{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.barstats{color:var(--muted);white-space:nowrap}.save{font-weight:600;color:var(--good);white-space:nowrap}.save.error{color:var(--bad)}.bar-actions{display:flex;gap:7px}.btn{border:1px solid #b8c2cf;background:#fff;color:var(--ink);border-radius:8px;padding:8px 11px;font-weight:600}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--bad)}
.shell{max-width:1500px;margin:auto;padding:18px 24px 56px}.stage-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}.stage-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;text-align:left;font-weight:600}.stage-btn.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.stage-btn.done{color:var(--good);background:var(--goodsoft)}.stage-btn .sub{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.casehead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin:4px 0 14px}.casehead h1{font-size:25px;line-height:1.2;margin:0 0 5px}.case-meta{color:var(--muted)}.independent{font-size:13px;color:#465367;margin-top:7px}.task{border-left:3px solid var(--accent);padding:7px 0 7px 12px;margin:12px 0 16px}.task strong{display:block;font-size:15px}.task span{color:var(--muted)}
.optionnav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.option-btn{min-width:74px;border:1px solid #b8c2cf;background:#fff;border-radius:8px;padding:8px 10px;font-weight:600}.option-btn.active{border-color:var(--accent);background:var(--accentsoft);color:#2447b5}.option-btn.done{border-color:#9dcdb4}.option-btn.invalid{color:var(--muted);background:#f2f4f7}.option-summary{color:var(--muted);font-size:13px;margin-left:auto}
.unitnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-block:1px solid var(--line);padding:9px 0;margin-bottom:14px}.unit-link{min-width:34px;height:34px;border:1px solid #c2cad5;background:#fff;border-radius:7px;font-weight:600}.unit-link.active{border-color:var(--accent);background:var(--accent);color:#fff}.unit-link.done{border-color:#8fc5a8;color:var(--good)}.unit-link.flagged::after{content:" ⚑";color:var(--warn)}.final-link{width:auto;padding:0 10px}.local-progress{margin-left:auto;color:var(--muted);font-size:13px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);background:#fff;min-height:350px}.pane{min-width:0;padding:18px 20px}.pane+.pane{border-left:1px solid var(--line)}.panehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panehead h2{font-size:15px;margin:0}.pageprov{font-weight:600;color:var(--muted)}.source-tabs,.mobile-tabs{display:flex;gap:5px}.tab{border:1px solid #c3ccd8;background:#fff;border-radius:7px;padding:6px 9px;font-size:13px}.tab.active{border-color:var(--accent);background:var(--accentsoft)}.prose{font-size:15.5px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;max-width:78ch}.source-scroll{max-height:55vh;overflow:auto}.source-highlight{background:#fff2b8;border:1px solid #d8b34c;border-radius:4px;padding:1px 2px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:12px}.meta strong{color:var(--ink);font-weight:600}.render-unavailable{padding:22px;border:1px dashed #b9c3d0;background:var(--soft);color:var(--muted);text-align:center}.mobile-tabs{display:none}
.scoring{max-width:980px;margin:18px auto 0}.criterion{border-top:1px solid var(--line);padding:14px 0}.criterion:first-child{border-top:0}.criterion.complete:not(.active){padding:10px 0}.criterion.complete:not(.active) .criterion-body{display:none}.criterion.active{border:1px solid #aabaf2;background:#fbfcff;border-radius:10px;padding:14px;margin:0 0 8px}.criterion-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.criterion-name{font-weight:700;font-size:15px}.criterion-pos{color:var(--muted);font-size:13px}.question{font-size:17px;font-weight:600;margin:7px 0 5px}.guidance{color:var(--muted);margin-bottom:10px}.score-group{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.score-choice{position:relative}.score-choice input{position:absolute;opacity:0;pointer-events:none}.score-choice label{display:block;text-align:center;border:1px solid #aeb9c8;background:#fff;border-radius:8px;padding:10px 8px;font-weight:600}.score-choice input:checked+label{border-color:var(--accent);background:var(--accentsoft);box-shadow:inset 0 0 0 1px var(--accent)}.score-choice input:focus-visible+label{outline:3px solid #7b96f4;outline-offset:2px}.criterion-summary{color:var(--muted);font-size:13px;margin-top:3px}.score-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.text-action{border:0;background:transparent;color:#3157d5;padding:5px 0;font-weight:600}.flag.on{color:var(--warn)}.note-wrap{margin-top:9px}.note-wrap textarea{width:100%;min-height:76px;border:1px solid #b8c2cf;border-radius:8px;padding:9px;resize:vertical}.localnav{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:13px}.continue{min-width:120px}
.final-view .workspace{min-height:420px}.outline{font-size:14px;line-height:1.55}.outline-row{padding:5px 0;border-bottom:1px solid #edf0f3}.raw{margin-top:13px}.raw summary{color:var(--muted);cursor:pointer}.raw pre{font:12px/1.5 Consolas,monospace;background:#172033;color:#eef2f7;padding:12px;border-radius:8px;overflow:auto;max-height:320px}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(17,24,39,.45);display:grid;place-items:center;padding:20px}.dialog{background:#fff;border-radius:12px;border:1px solid var(--line);width:min(720px,100%);max-height:86vh;overflow:auto;padding:20px}.dialog h2{margin-top:0}.dialog.source-dialog{width:min(1100px,96vw);padding:16px}.source-page{margin:0 0 20px}.source-page h3{margin:0 0 8px}.source-page img{display:block;width:100%;height:auto;border:1px solid var(--line);background:#fff}.source-page-missing{padding:18px;border:1px dashed #b9c3d0;background:var(--soft);color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.helpgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.helpbox{border:1px solid var(--line);padding:12px;border-radius:8px}.helpbox h3{margin:0 0 6px;font-size:14px}.landing{max-width:720px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px}.landing h1{margin:0 0 8px}.landing-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:var(--soft);padding:13px;border-radius:8px}.stat strong{display:block;font-size:22px}.warning{border:1px solid #e0b653;background:var(--warnsoft);padding:10px 12px;border-radius:8px;color:#704c00;margin-bottom:12px}.complete-screen{max-width:760px;margin:7vh auto;text-align:center}.complete-screen h1{font-size:30px}.complete-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.more{position:relative}.more-menu{position:absolute;right:0;top:42px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;min-width:190px;box-shadow:0 10px 25px rgba(16,24,40,.12);z-index:70}.more-menu button{width:100%;text-align:left;border:0;background:#fff;padding:8px;border-radius:5px}.more-menu button:hover{background:var(--soft)}.status-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.reviewbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid #e0b653;background:var(--warnsoft);padding:9px 11px;border-radius:9px;margin-bottom:12px}.reviewbar strong{margin-right:auto}
@media(max-width:900px){:root{--header-h:104px}.barrow{flex-wrap:wrap}.crumb{order:3;flex-basis:100%}.stage-nav{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}.mobile-tabs{display:flex;margin-bottom:10px}.workspace.mobile-source .output-pane,.workspace.mobile-output .source-pane{display:none}.helpgrid{grid-template-columns:1fr}.bar-actions .desktop-label{display:none}}
@media(max-width:560px){.shell{padding:12px 12px 40px}.appbar{padding:8px 12px}.stage-nav{grid-template-columns:1fr 1fr}.casehead{grid-template-columns:1fr}.option-summary{width:100%;margin-left:0}.score-group{gap:5px}.score-choice label{padding:12px 6px;font-size:14px;min-height:44px}.unit-link,.option-btn,.tab,.continue{min-height:44px}.landing-stats,.complete-stats{grid-template-columns:1fr}.barstats{font-size:12px}.brand{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* Small additions required by current output schema; historical palette and layout retained. */
.case-select{border:1px solid var(--line);border-radius:7px;padding:8px;max-width:100%;background:white;color:var(--ink)}
.panel-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.unit-text{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.field-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.badge{font-size:12px;background:#eef2ff;border-radius:5px;padding:3px 7px}
.pane .unit-caption{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.small{font-size:12px;color:var(--muted)}.source-link{font-size:13px}.flagged-note{color:var(--warn);font-weight:700}
.btn:disabled{opacity:.4}.break{overflow-wrap:anywhere}.source-warning{color:#946200}
.case-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.case-controls label{font-weight:600}
.scoring .criterion{background:transparent}.criterion.complete:not(.active) .criterion-body{display:block}
#note{width:100%;min-height:70px;padding:9px;border:1px solid #b8c2cf;border-radius:8px;resize:vertical}
#sourceImage{width:100%;display:block;border:1px solid var(--line);margin-top:12px}
/* Show all criteria together and center compact, unmistakable binary controls. */
.scoring .criterion{padding:16px 18px;margin:0 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.scoring .criterion.complete{background:#fbfcff}
.scoring .criterion.complete .criterion-body{display:block}
.scoring .criterion .criterion-top{align-items:center}
.scoring .score-group{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px auto 8px}
.scoring .score-choice{width:min(230px,100%);min-height:46px;border:1px solid #aeb9c8;border-radius:8px;background:#fff;color:var(--ink);padding:11px 14px;font-weight:700}
.scoring .score-choice.chosen-fail{border:2px solid #b42318;background:#fff0ef;color:#a21b12}
.scoring .score-choice.chosen-pass{border:2px solid #16784b;background:#ecfdf3;color:#11633e}
.scoring .criterion-result{font-weight:750;font-size:16px;margin-left:auto}
.scoring .criterion-result.fail{color:#b42318}
.scoring .criterion-result.pass{color:#16784b}
@media(max-width:560px){.scoring .score-group{gap:8px}.scoring .score-choice{flex:1 1 135px;width:auto}}

</style></head>
<body>
<div id="landing"></div>
<div id="app" class="hidden">
<header class="appbar"><div class="barrow"><div class="brand">TRANSPLATE</div><div class="crumb" id="crumb"></div><div class="barstats" id="globalProgress"></div><div class="save" id="saveStatus" role="status">Saved locally ✓</div><div class="bar-actions"><button class="btn" id="rubricBtn">Rubric</button><button class="btn" id="findBtn">Find incomplete</button><button class="btn primary" id="continueTop">Continue</button><div class="more"><button class="btn" id="moreBtn" aria-expanded="false">⋯</button><div class="more-menu hidden" id="moreMenu"><button id="exportBtn">Download checkpoint / results</button><button id="importBtn">Import checkpoint</button><button id="helpBtn">How evaluation works</button><button id="reviewFlagsBtn">Review flagged</button><button class="btn danger" id="resetBtn">Clear local evaluation…</button></div></div></div></div></header>
<main class="shell"><nav class="stage-nav" id="stageNav" aria-label="Stages"></nav><div id="workspace"></div></main>
</div>
<input id="importFile" type="file" accept="application/json" class="hidden"><div id="overlayRoot"></div>
<script>
/* TRANSPLATE_DATA */
const STAGES = [
 {key:'parse', title:'Parsing', short:'Reconstruct source units', description:'Did the model identify faithful, appropriately structured textual units?',unit:[['source_fidelity','Source fidelity','Compare the reproduced English with the original extracted source; a mismatch is evidence to inspect, not an automatic judgment.'],['grouping','Unit grouping','Are the source blocks grouped into coherent textual units without invented text or unnecessary fragmentation?']],final:[['boundaries','Complete page structure','Check the entire response for omitted or repeated text blocks and inappropriate grouping of consecutive blocks.']]},
 {key:'examine',title:'Examination',short:'Math, editorial and technical review',description:'Did the model accurately identify relevant issues without inventing problems?',unit:[['math','Mathematical notation','Is the model’s assessment of mathematical content and notation supported by this source unit?'],['editorial','Editorial accuracy','Is its typographical or transcription assessment supported by the text?'],['technical','Technical accuracy','Is its technical-issue assessment appropriately grounded and qualified?']],final:[]},
 {key:'translate',title:'Translation',short:'English → Spanish',description:'Does this translation faithfully render the English source in appropriate Spanish?',unit:[['semantic_fidelity','Semantic fidelity','Preserve the source meaning without omissions, additions, or unintended changes.'],['technical_accuracy','Technical accuracy','Preserve technical terminology, numbers, citations, and mathematical notation.'],['spanish_quality','Spanish quality','Is the result idiomatic, grammatical and appropriate for the source register?'],['structure_preservation','Structure preservation','Preserve the source unit’s structure, formatting, and relevant punctuation.']],final:[]}
];
// New key prevents prior 0/1/2 scores from being mistaken for binary judgments.
const STORE='transplate-dashboard:binary-v2:'+DATA.run_id+':'+(DATA.scope||'all');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={scores:{},notes:{},flags:{},cursor:{ci:0,oi:0,ui:0,ri:0},started:false};
try{const saved=localStorage.getItem(STORE);if(saved){const old=JSON.parse(saved);if(old&&old.scores&&old.cursor)state=old;}}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));$('saveStatus').textContent='Saved locally ✓';$('saveStatus').classList.remove('error')}catch(e){$('saveStatus').textContent='Local save unavailable — export checkpoint';$('saveStatus').classList.add('error')}}
function current(){const c=DATA.cases[state.cursor.ci],o=c.options[state.cursor.oi],u=o.items[state.cursor.ui];return {c,o,u,stage:STAGES.find(x=>x.key===c.stage)}}
function criteria(c,o,ui){const stage=STAGES.find(s=>s.key===c.stage);if(ui===o.items.length)return stage.final;if(c.stage==='parse'&&o.items[ui]?.kind!==undefined)return [['source_fidelity','Source fidelity','Compare the reproduced English against source evidence.'],['classification','Unit classification','Does the historical model classify the unit accurately?']];if(c.stage==='examine'&&(Array.isArray(o.items[ui]?.e)||Array.isArray(o.items[ui]?.patches)))return [['math','Mathematical notation','Is the model correct about mathematical content and notation, with clear source-grounded patches only when necessary?'],['editorial','Conservative proofreading','Are proposed mechanical corrections uniquely applicable, necessary, and free of stylistic/substantive rewrites?'],['wrong','Wrong','Is the substantive-error flag justified or correctly withheld when uncertain?'],['misleading','Misleading','Is the material-misimpression flag justified or correctly withheld, not merely a stylistic objection?'],['dismissive','Pedagogical dismissiveness','Is the narrow instructional-trivialization flag justified or correctly withheld?']];if(c.stage==='examine'&&o.items[ui]?.wrong_issue!==undefined)return stage.unit.map(r=>r[0]==='technical'?['technical','Technical review','Are the wrong, misleading and narrowly pedagogical dismissive flags independently justified, with appropriate restraint?']:r);return stage.unit}
function scopeKey(c,o,ui){return c.id+'|'+o.anonymous_id+'|'+(ui===o.items.length?'final':ui)}
function targets(){const rows=[];DATA.cases.forEach((c,ci)=>c.options.forEach((o,oi)=>{for(let ui=0;ui<o.items.length;ui++){criteria(c,o,ui).forEach(([criterion])=>rows.push({ci,oi,ui,criterion,key:scopeKey(c,o,ui)}))}criteria(c,o,o.items.length).forEach(([criterion])=>rows.push({ci,oi,ui:o.items.length,criterion,key:scopeKey(c,o,o.items.length)}))}));return rows}
const TARGETS=targets();
function answered(t){return [0,1].includes(state.scores[t.key]?.[t.criterion])}
function count(){return {all:TARGETS.length,done:TARGETS.filter(answered).length}}
function optionComplete(c,o){const list=TARGETS.filter(t=>DATA.cases[t.ci]===c&&c.options[t.oi]===o);return list.every(answered)}
function stageCount(stage){const list=TARGETS.filter(t=>DATA.cases[t.ci].stage===stage);return {all:list.length,done:list.filter(answered).length}}
function cursorTargets(){const {c,o}=current();let ui=state.cursor.ui;return TARGETS.filter(t=>DATA.cases[t.ci]===c&&c.options[t.oi]===o&&t.ui===ui)}
function navigate(ci,oi=0,ui=0,ri=0){state.cursor={ci,oi,ui,ri};save();render();window.scrollTo({top:0,behavior:'instant'})}
// All criteria for a unit are visible; Continue moves to the next unit, not the next criterion.
function next(){const last=TARGETS.findLastIndex(t=>t.ci===state.cursor.ci&&t.oi===state.cursor.oi&&t.ui===state.cursor.ui);if(last>=0&&last+1<TARGETS.length){const n=TARGETS[last+1];navigate(n.ci,n.oi,n.ui)}else if(count().done===count().all){showFinish()}else{findIncomplete()}}
function previous(){const first=TARGETS.findIndex(t=>t.ci===state.cursor.ci&&t.oi===state.cursor.oi&&t.ui===state.cursor.ui);if(first>0){const t=TARGETS[first-1];navigate(t.ci,t.oi,t.ui)}}
function findIncomplete(){const t=TARGETS.find(x=>!answered(x));if(!t){showFinish();return}const siblings=TARGETS.filter(x=>x.ci===t.ci&&x.oi===t.oi&&x.ui===t.ui);navigate(t.ci,t.oi,t.ui,siblings.findIndex(x=>x.criterion===t.criterion))}
function showLanding(){const n=count();$('landing').innerHTML=`<section class="landing"><div class="brand">TRANSPLATE</div><h1>Blind Human Evaluation</h1><p>Compare model outputs against the original OECD source. Review each option independently; A/B/C labels do not identify the same model across cases.</p><div class="landing-stats"><div class="stat"><strong>${DATA.cases.length}</strong>Cases</div><div class="stat"><strong>${DATA.cases.reduce((n,c)=>n+c.options.length,0)}</strong>Anonymous options</div><div class="stat"><strong>${n.done}/${n.all}</strong>Scores</div></div><div class="warning">Reviewers: do not open the separate model key. Invalid responses are shown for diagnostic scoring only and cannot qualify, irrespective of scores. Progress is stored in this browser; download checkpoints for backup.</div><button class="btn primary" id="startBtn">${state.started?'Resume evaluation':'Start evaluation'}</button> <button class="btn" id="landingImport">Import checkpoint</button><p class="small">Run ${esc(DATA.run_id)} · Self-contained, offline evaluation · No API calls</p></section>`;$('startBtn').onclick=()=>{state.started=true;save();$('landing').classList.add('hidden');$('app').classList.remove('hidden');render()};$('landingImport').onclick=()=>$('importFile').click()}
function showFinish(){openDialog('Evaluation progress',`<p>Completed <strong>${count().done} of ${count().all}</strong> required scores.</p><p>${count().done===count().all?'All required criteria are complete. Download results from the menu.':'Find incomplete to continue.'}</p>`)}
function render(){const {c,o,stage}=current();const n=count();$('crumb').textContent=`${stage.title} / ${c.document.toUpperCase()} / ${c.stage==='translate'?c.unit_id:'Page '+c.page}`;$('globalProgress').textContent=`${n.done}/${n.all} scored`;
 $('stageNav').innerHTML=STAGES.map(s=>{const first=DATA.cases.findIndex(c=>c.stage===s.key),q=stageCount(s.key);return `<button class="stage-btn ${c.stage===s.key?'active':''} ${q.all&&q.done===q.all?'done':''}" data-stage="${s.key}">${esc(s.title)}<span class="sub">${q.done}/${q.all} · ${esc(s.short)}</span></button>`}).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>navigate(DATA.cases.findIndex(c=>c.stage===b.dataset.stage)));
 const stageCases=DATA.cases.map((c,i)=>({c,i})).filter(x=>x.c.stage===c.stage),within=stageCases.findIndex(x=>x.i===state.cursor.ci);
 const pageNo=c.stage==='translate'?`Unit ${esc(c.unit_id)}`:`Page ${esc(c.page)}`;
 $('workspace').innerHTML=`<div class="casehead"><div><h1>${esc(stage.title)} · ${esc(c.document.toUpperCase())}</h1><div class="case-meta">${pageNo} · Case ${within+1} of ${stageCases.length}</div><div class="independent">Assess each option independently. Its label is local to this case.</div></div><div class="case-controls"><label for="caseSelect">Case</label><button class="btn" id="prevCase" ${within===0?'disabled':''}>←</button><select class="case-select" id="caseSelect">${stageCases.map(({c:sc,i},idx)=>`<option value="${i}" ${i===state.cursor.ci?'selected':''}>${idx+1}. ${esc(sc.document.toUpperCase())} · ${sc.stage==='translate'?esc(sc.unit_id):'Page '+sc.page}</option>`).join('')}</select><button class="btn" id="nextCase" ${within===stageCases.length-1?'disabled':''}>→</button></div></div><div class="task"><strong>${esc(stage.description)}</strong><span>${esc(stage.short)} · Read the source before scoring.</span></div>${o.invalid?`<div class="warning" role="status"><strong>Invalid response — diagnostic review only.</strong> Machine validation failed: ${esc(o.validation_error)}. Any human scores are recorded separately from qualifying results. <details><summary>Inspect full rejected response</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(o.raw_output)}</pre></details></div>`:''}<div class="optionnav">${c.options.map((option,oi)=>`<button class="option-btn ${state.cursor.oi===oi?'active':''} ${optionComplete(c,option)?'done':''} ${option.invalid?'invalid':''}" data-option="${oi}" title="${option.invalid?'Invalid output — diagnostic review only':'Valid output'}">Option ${option.label}${option.invalid?' ⚠':''}</button>`).join('')}<span class="option-summary">Model identities hidden</span></div><nav class="unitnav">${o.items.map((item,ui)=>{const q=TARGETS.filter(t=>t.ci===state.cursor.ci&&t.oi===state.cursor.oi&&t.ui===ui);return `<button class="unit-link ${state.cursor.ui===ui?'active':''} ${q.every(answered)?'done':''} ${state.flags[scopeKey(c,o,ui)]?'flagged':''}" data-unit="${ui}" title="Unit ${ui+1}">${ui+1}</button>`}).join('')}${stage.final.length?`<button class="unit-link final-link ${state.cursor.ui===o.items.length?'active':''}" data-unit="${o.items.length}">Final structural check</button>`:''}<span class="local-progress">${TARGETS.filter(t=>t.ci===state.cursor.ci&&t.oi===state.cursor.oi&&answered(t)).length}/${TARGETS.filter(t=>t.ci===state.cursor.ci&&t.oi===state.cursor.oi).length}</span></nav><div class="workspace"><section class="pane source-pane"><div class="panehead"><h2>Original source</h2><span class="pageprov">${esc(c.document.toUpperCase())} · p. ${c.page}</span></div><div class="panel-actions"><a class="source-link" href="${esc(c.pdf_url)}#page=${c.page}" target="_blank" rel="noopener">Open original PDF ↗</a><button class="tab" id="fullSourceBtn">View original page</button></div><div class="source-scroll">${sourceHTML(c,o)}</div></section><section class="pane output-pane"><div class="panehead"><h2>Model output · Option ${o.label}</h2><span class="pageprov">${state.cursor.ui===o.items.length?'Whole response':'Unit '+(state.cursor.ui+1)+' / '+o.items.length}</span></div>${outputHTML(c,o)}</section></div><section class="scoring">${scoringHTML(c,o)}<div class="localnav"><button class="btn" id="prevUnit">← Previous</button><button class="btn primary continue" id="nextUnit">Continue →</button></div></section>`;
 $('caseSelect').onchange=e=>navigate(+e.target.value);$('prevCase').onclick=()=>navigate(stageCases[within-1]?.i??state.cursor.ci);$('nextCase').onclick=()=>navigate(stageCases[within+1]?.i??state.cursor.ci);
 document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>navigate(state.cursor.ci,+b.dataset.option));document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>navigate(state.cursor.ci,state.cursor.oi,+b.dataset.unit));
 document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{const key=scopeKey(c,o,state.cursor.ui),cr=b.dataset.criterion;state.scores[key]??={};state.scores[key][cr]=+b.dataset.score;save();render()});
 $('note').oninput=e=>{state.notes[scopeKey(c,o,state.cursor.ui)]=e.target.value;save()};$('flagBtn').onclick=()=>{const k=scopeKey(c,o,state.cursor.ui);state.flags[k]=!state.flags[k];save();render()};
 $('prevUnit').onclick=previous;$('nextUnit').onclick=next;$('fullSourceBtn').onclick=()=>showPage(c);
 }
function sourceHTML(c,o){const u=o.items[state.cursor.ui];let active=[];if(state.cursor.ui===o.items.length)active=c.blocks.map(x=>x.unit_id);else if(c.stage==='parse')active=u.src||u.source_ids||[];else active=[u.unit_id||c.blocks.find(b=>b.id===u.id)?.unit_id];return `<div class="prose">${c.blocks.map(b=>`<div class="unit-text" ${active.includes(b.unit_id)?'style="border-color:#d8b34c;background:#fff8dd"':''}><span class="unit-caption">${esc(b.unit_id)}</span><br>${esc(b.english)}</div>`).join('')}</div>`}
function outputHTML(c,o){if(state.cursor.ui===o.items.length){return `<p class="small">Inspect the complete output and its grouping.</p><div class="outline">${o.items.map((u,i)=>`<div class="outline-row"><strong>${i+1}. ${esc(u.kind||u.id||u.unit_id)}</strong> ${esc(u.x||u.english||u.rn||u.note||u.sp||u.spanish||'')}</div>`).join('')}</div>`}
 const u=o.items[state.cursor.ui];if(c.stage==='parse')return `<div class="field-row">${u.kind?`<span class="badge">${esc(u.kind)}</span>`:''}<span class="badge">${esc((u.src||u.source_ids||[]).join(', '))}</span>${u.m?`<span class="badge">Math: ${u.m}</span>`:''}${!u.source_match?'<span class="badge source-warning">Source text mismatch — inspect</span>':''}</div><div class="unit-caption">Model transcription (x)</div><div class="prose unit-text">${esc(u.x||u.english)}</div>${!u.source_match?`<details><summary>Extracted source text</summary><div class="unit-text prose">${esc(u.source_english)}</div></details>`:''}`;
 if(c.stage==='examine'&&u.v!==undefined)return `<div class="field-row">${([['Verified input',u.v],['Math present',u.m],['LaTeX normalization',u.ml],['Wrong',u.wr],['Misleading',u.mi],['Pedagogically dismissive',u.di]]).map(([label,val])=>`<span class="badge">${esc(label)}: <strong>${esc(val)}</strong></span>`).join('')}</div><h3>Conservative correction patches (e)</h3>${Array.isArray(u.e)&&u.e.length?u.e.map(p=>`<div class="unit-text"><span class="unit-caption">Replace</span><div class="prose">${esc(p.old)}</div><span class="unit-caption">With</span><div class="prose">${esc(p.new)}</div></div>`).join(''):'<p class="small">No correction proposed.</p>'}<h3>Technical review note (rn)</h3><div class="prose unit-text">${esc(u.rn)}</div>`;
 if(c.stage==='examine')return `<div class="field-row">${([['Math present',u.has_math],['Notation issue',u.notation_issue],['Typographical issue',u.typo_issue],...(u.wrong_issue===undefined?[['Technical issue',u.technical_issue]]:[['Wrong',u.wrong_issue],['Misleading',u.misleading_issue],['Pedagogically dismissive',u.dismissive_issue]])]).map(([label,val])=>`<span class="badge">${esc(label)}: <strong>${val?'Yes':'No'}</strong></span>`).join('')}</div>${Array.isArray(u.patches)?`<h3>Conservative correction patches</h3>${u.patches.length?u.patches.map(p=>`<div class="unit-text"><span class="unit-caption">Replace</span><div class="prose">${esc(p.old)}</div><span class="unit-caption">With</span><div class="prose">${esc(p.new)}</div></div>`).join(''):'<p class="small">No correction proposed.</p>'}`:''}<h3>Model explanation</h3><div class="prose unit-text">${esc(u.note)}</div>`;
 return `<div class="unit-caption">Spanish translation</div><div class="prose unit-text" lang="es">${esc(u.sp||u.spanish)}</div>`}
function scoringHTML(c,o){
 const list=cursorTargets(),rules=criteria(c,o,state.cursor.ui);
 if(!list.length)return '<p>Nothing to score here.</p>';
 return `<div class="meta"><strong>${esc(c.stage.toUpperCase())}</strong><span>${list.length} criteria · All shown</span><span>Scale: 0 · Does not meet / 1 · Meets</span>${o.invalid?'<span class="flagged-note">Diagnostic only · invalid output</span>':''}</div>`+
 list.map((t,i)=>{
  const selected=state.scores[t.key]?.[t.criterion];
  const result=selected===0?'<span class="criterion-result fail" aria-label="Does not meet">✗</span>':selected===1?'<span class="criterion-result pass" aria-label="Meets">✓</span>':'';
  return `<div class="criterion ${selected===0||selected===1?'complete':''}"><div class="criterion-top"><span class="criterion-name">${esc(rules[i][1])}</span>${result}<span class="criterion-pos">${i+1} / ${list.length}</span></div><div class="question">${esc(rules[i][1])}?</div><div class="guidance">${esc(rules[i][2])}</div><div class="score-group" role="group" aria-label="${esc(rules[i][1])}">${[['0','Does not meet'],['1','Meets']].map(([n,title])=>`<button class="score-choice ${selected===+n?(n==='0'?'chosen-fail':'chosen-pass'):''}" data-score="${n}" data-criterion="${esc(t.criterion)}" aria-pressed="${selected===+n}">${selected===+n?(n==='0'?'✗ ':'✓ '):''}${n} · ${title}</button>`).join('')}</div></div>`;
 }).join('')+
 `<div class="note-wrap"><label for="note" class="small">Notes (optional, attached to this unit or final check)</label><textarea id="note" maxlength="10000" placeholder="Optional explanation…">${esc(state.notes[list[0].key]||'')}</textarea><button class="text-action flag ${state.flags[list[0].key]?'on':''}" id="flagBtn">${state.flags[list[0].key]?'⚑ Flagged for review':'⚐ Flag for review'}</button></div><div class="small">Scored criteria for this unit: ${list.filter(answered).length}/${list.length}</div>`;
}
function openDialog(title,html){$('overlayRoot').innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true"><h2>${esc(title)}</h2>${html}<div class="dialog-actions"><button class="btn" id="closeDialog">Close</button></div></section></div>`;$('closeDialog').onclick=()=>{$('overlayRoot').innerHTML=''};$('overlayRoot').querySelector('.overlay').onclick=e=>{if(e.target===e.currentTarget)$('overlayRoot').innerHTML=''}}
function showPage(c){const image=DATA.source_images[c.document+':'+c.page];openDialog('Original PDF · '+c.document.toUpperCase()+' · Page '+c.page,image?`<div style="max-height:65vh;overflow:auto"><img id="sourceImage" src="${image}" alt="Original PDF page"></div>`:`<p>Rendered PDF not present when this dashboard was generated. Use the source link in the left pane; the extracted original text is displayed alongside the model output.</p><a href="${esc(c.pdf_url)}#page=${c.page}" target="_blank" rel="noopener">Open PDF page ↗</a>`)}
function rubric(){const {c,o,stage}=current();const rules=criteria(c,o,0);openDialog(stage.title+' rubric',`<p>${esc(stage.description)}</p><p><strong>0 · Does not meet:</strong> The output fails this requirement.<br><strong>1 · Meets:</strong> The output satisfies this requirement.</p><p>Invalid outputs can be inspected and scored diagnostically but cannot qualify, irrespective of human judgments.</p>${[...rules,...stage.final].map(([,name,guide])=>`<p><strong>${esc(name)}</strong><br>${esc(guide)}</p>`).join('')}<p class="small">Judgments are independent: do not rank anonymous options.</p>`)}
function exportData(){const n=count(),complete=n.done===n.all,rows=TARGETS.map(t=>{const c=DATA.cases[t.ci],o=c.options[t.oi],u=o.items[t.ui],k=t.key;return {case_id:c.id,stage:c.stage,document_id:c.document,page:c.page,anonymous_id:o.anonymous_id,option:o.label,machine_valid:!o.invalid,validation_error:o.invalid?o.validation_error:null,evaluation_role:o.invalid?'diagnostic_only':'qualifying_candidate',scope:u?'unit':'final',unit_position:u?t.ui+1:null,source_unit_ids:u?(u.src||u.source_ids||[u.unit_id||c.blocks.find(b=>b.id===u.id)?.unit_id]):c.blocks.map(b=>b.unit_id),criterion:t.criterion,score:state.scores[k]?.[t.criterion]??null,note:state.notes[k]||'',flagged:!!state.flags[k]}});
 const output={schema_version:'transplate-clean-dashboard-2',scoring_scale:'binary',rows:rows.filter(r=>r.machine_valid),diagnostic_rows:rows.filter(r=>!r.machine_valid),invalid_options:DATA.cases.flatMap(c=>c.options.filter(o=>o.invalid).map(o=>({case_id:c.id,anonymous_id:o.anonymous_id,validation_error:o.validation_error,machine_valid:false,evaluation_role:'diagnostic_only'}))),run_id:DATA.run_id,scope:DATA.scope||'all',export_type:complete?'final_evaluation':'checkpoint',exported_at:new Date().toISOString(),complete,counts:{required:n.all,completed:n.done},state:complete?undefined:state};download(output,`transplate-${DATA.run_id}-${complete?'evaluation':'checkpoint'}.json`)}
function download(obj,name){const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(b);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
function importCheckpoint(file){const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(v.schema_version!=='transplate-clean-dashboard-2'||v.run_id!==DATA.run_id||(v.scope||'all')!==(DATA.scope||'all')||!v.state?.scores||!v.state?.cursor)throw Error('This file is not a resumable checkpoint for run '+DATA.run_id);if(Object.keys(state.scores).length&&!confirm('Replace locally saved scores with this checkpoint?'))return;state=v.state;save();$('landing').classList.add('hidden');$('app').classList.remove('hidden');state.started=true;render()}catch(e){alert('Checkpoint not imported: '+e.message)}};reader.readAsText(file)}
function flagged(){const scope=Object.keys(state.flags).find(k=>state.flags[k]);if(!scope){openDialog('Review flagged','<p>No units have been flagged.</p>');return}for(const t of TARGETS){if(t.key===scope){navigate(t.ci,t.oi,t.ui);return}}}
function bindGlobal(){$('rubricBtn').onclick=rubric;$('continueTop').onclick=next;$('findBtn').onclick=findIncomplete;$('moreBtn').onclick=()=>{$('moreMenu').classList.toggle('hidden')};$('exportBtn').onclick=()=>{$('moreMenu').classList.add('hidden');exportData()};$('importBtn').onclick=()=>$('importFile').click();$('helpBtn').onclick=()=>openDialog('How evaluation works','<p>Navigate Stage → Case → Option → Unit → Criterion. Read the original source and score anonymous model outputs independently.</p><p>0 = Does not meet; 1 = Meets requirement. Invalid outputs are visible for diagnostic assessment but are automatically ineligible for selection. Flags and notes are optional.</p><p>Evaluation is saved in this browser. Export checkpoints regularly; import one to resume. Full results are available after all required criteria are scored.</p><p>The private model mapping is never embedded in this page.</p>');$('reviewFlagsBtn').onclick=flagged;$('resetBtn').onclick=()=>{if(confirm('Erase all locally saved evaluation scores and notes for this run?')){localStorage.removeItem(STORE);location.reload()}};$('importFile').onchange=e=>{if(e.target.files[0])importCheckpoint(e.target.files[0]);e.target.value=''};document.addEventListener('click',e=>{if(e.target?.id==='prevCriterion'){state.cursor.ri--;save();render()}if(e.target?.id==='nextCriterion'){state.cursor.ri++;save();render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overlayRoot').innerHTML=''});}
bindGlobal();
if(state.started){$('landing').classList.add('hidden');$('app').classList.remove('hidden');render()}else showLanding();
</script></body></html>
