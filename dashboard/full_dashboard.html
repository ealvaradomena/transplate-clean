<script>/* TRANSPLATE_DATA */</script><script>
const $=id=>document.getElementById(id);

const STORE='transplate-dashboard:full-v1:'+DATA.run_id+':'+DATA.scope;

// Distinct examination outputs appear once; the private key maps each option to all matching models.
function key(c,o){return c.id+'|'+o.anonymous_id}
function issueList(o){return [...(Array.isArray(o.item.e)?o.item.e:[]).map((value,i)=>({kind:'correction',index:i,value})),...(Array.isArray(o.item.findings)?o.item.findings:[]).map((value,i)=>({kind:'finding',index:i,value}))];}

// Remove hard PDF line wraps solely in the displayed source unit; keep likely short headings.
function displaySource(text){const raw=String(text||'').replace(/\r\n/g,'\n');const lines=raw.split('\n').map(l=>l.trim());const first=lines[0]||'';const hasHeading=lines.length>1&&first.length>0&&first.length<=65&&!/[.!?:;,]$/.test(first)&&lines.slice(1).some(l=>l.length>45);const rest=hasHeading?raw.slice(raw.indexOf('\n')+1):raw;const body=rest.split(/\n\s*\n/).map(p=>p.split('\n').map(l=>l.trim()).filter(Boolean).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean).join('\n\n');return {heading:hasHeading?first:'',body};}
function highlightSource(text,patches){const hits=[];for(const p of patches||[]){const old=String(p.old||'').replace(/\s+/g,' ').trim();if(!old)continue;const start=text.indexOf(old);if(start>=0&&text.indexOf(old,start+1)<0)hits.push([start,start+old.length]);}hits.sort((a,b)=>a[0]-b[0]);let html='',cursor=0;for(const [start,end] of hits){if(start<cursor)continue;html+=esc(text.slice(cursor,start))+'<mark class="source-match">'+esc(text.slice(start,end))+'</mark>';cursor=end;}return html+esc(text.slice(cursor));}
function sourcePane(c,o=null){const formatted=displaySource(c.english);const patches=c.stage==='examine'?o?.item?.e:[];return `<section class="pane source-pane"><div class="panehead"><h2>Original source</h2><strong class="pageprov">${esc(c.document.toUpperCase())} · p. ${c.page}</strong></div><div class="panel-actions"><a href="${esc(c.pdf_url)}#page=${c.page}" target="_blank" rel="noopener">Open original PDF ↗</a><button id="pageBtn" class="btn">View original page</button></div><div class="prose unit-text source-focus"><div class="source-unit-label">Selected source unit${Array.isArray(patches)&&patches.length?' · proposed changes highlighted':''}</div>${formatted.heading?`<span class="source-heading">${esc(formatted.heading)}</span>`:''}<div class="source-copy">${highlightSource(formatted.body,patches)}</div></div></section>`;}

function download(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);}
function importCheckpoint(file){const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(v.schema_version!=='transplate-full-dashboard-1'||v.run_id!==DATA.run_id||v.scope!==DATA.scope||!v.state?.scores||!v.state?.ranks)throw Error('Checkpoint does not match this dashboard.');if((Object.keys(state.scores).length||Object.keys(state.ranks).length)&&!confirm('Replace your locally saved evaluation with this checkpoint?'))return;state=v.state;state.started=true;save();$('landing').classList.add('hidden');$('app').classList.remove('hidden');render();}catch(e){alert('Cannot import checkpoint: '+e.message);}};reader.readAsText(file);}
$('rubricBtn').onclick=rubric;$('continueTop').onclick=next;$('findBtn').onclick=findIncomplete;$('moreBtn').onclick=()=>$('moreMenu').classList.toggle('hidden');$('exportBtn').onclick=()=>{exportData();$('moreMenu').classList.add('hidden');};$('importBtn').onclick=()=>$('importFile').click();$('helpBtn').onclick=()=>openDialog('How evaluation works','<p>Each eligible source unit has a review case. Only available model responses can be assessed; absent responses remain missing. Identical examination outputs are presented once, with judgments shared. Translation choices appear together and can tie. Model attribution is stored separately.</p><p>Results and checkpoints can be exported at any time. Neither this dashboard nor its source contains model identities.</p>');$('resetBtn').onclick=()=>{if(confirm('Clear all evaluation progress for this dashboard?')){localStorage.removeItem(STORE);location.reload();}};$('importFile').onchange=e=>{if(e.target.files[0])importCheckpoint(e.target.files[0]);e.target.value='';};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overlayRoot').innerHTML='';});
if(state.started){$('landing').classList.add('hidden');$('app').classList.remove('hidden');render();}else showLanding();
</script></body></html>
